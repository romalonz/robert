name: windows-installer

on:
  push:
    branches: [robert-main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (bindgen for whisper-rs)
        run: choco install llvm -y --no-progress

      - name: Install frontend deps
        run: npm install

      - name: Build Windows installer (NSIS, signed for auto-update)
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          # signing key lives only as an encrypted repo secret; nobody who
          # clones the repo or has the exe can produce a valid signed update
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Robert-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - name: Publish signed update feed (latest.json) to the release
        if: ${{ github.ref == 'refs/heads/robert-main' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "no installer built"; exit 1 }
          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) { Write-Host "no .sig (signing secret not set?) — skipping update feed"; exit 0 }
          $sig = Get-Content $sigPath -Raw
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $url = "https://github.com/romalonzo/robert-app/releases/download/v0.1.1/$($exe.Name)"
          $feed = [ordered]@{
            version   = $ver
            notes     = "Robert update"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64" = [ordered]@{ signature = $sig.Trim(); url = $url } }
          }
          $feed | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 latest.json
          gh release upload v0.1.1 $exe.FullName $sigPath latest.json --clobber -R romalonzo/robert-app

  # Proves the done-for-you local-brain path on real Windows: the exact
  # download URL, silent installer flags, install location, and that the
  # server answers on 11434 afterwards. Independent of the installer build.
  ollama-silent-install-probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Download OllamaSetup.exe
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://ollama.com/download/OllamaSetup.exe -OutFile "$env:TEMP\OllamaSetup.exe"
          (Get-Item "$env:TEMP\OllamaSetup.exe").Length

      - name: Silent install (/VERYSILENT /SUPPRESSMSGBOXES /NORESTART)
        shell: pwsh
        run: |
          # Do NOT use -Wait: it waits for descendants too, and the installer
          # launches the Ollama tray app, which never exits. Wait for the
          # installer process itself (bounded), and treat "ollama.exe present"
          # as the real success signal, exactly like local_brain.rs does.
          $p = Start-Process -FilePath "$env:TEMP\OllamaSetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          $bin = Join-Path $env:LOCALAPPDATA "Programs\Ollama\ollama.exe"
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            if ($p.HasExited) { "installer exited with code $($p.ExitCode) after $([int]((Get-Date) - $p.StartTime).TotalSeconds)s"; break }
            Start-Sleep -Seconds 5
          }
          if (-not $p.HasExited) {
            "installer still running after 10 min; ollama.exe present: $(Test-Path $bin)"
            Get-Process | Where-Object { $_.Name -like '*llama*' -or $_.Name -like '*Setup*' } | Select-Object Name, Id, StartTime | Format-Table | Out-String
            if (-not (Test-Path $bin)) { exit 1 }
          } elseif ($p.ExitCode -ne 0) { exit 1 }

      - name: Verify install location used by local_brain.rs
        shell: pwsh
        run: |
          $bin = Join-Path $env:LOCALAPPDATA "Programs\Ollama\ollama.exe"
          $app = Join-Path $env:LOCALAPPDATA "Programs\Ollama\ollama app.exe"
          if (-not (Test-Path $bin)) { Write-Error "ollama.exe not at $bin"; Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Depth 1 | Select-Object FullName; exit 1 }
          "ollama.exe: $bin"
          "ollama app.exe present: $(Test-Path $app)"
          & $bin --version

      - name: Server answers on 11434 (start like local_brain.rs does)
        shell: pwsh
        run: |
          $bin = Join-Path $env:LOCALAPPDATA "Programs\Ollama\ollama.exe"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $r = Invoke-RestMethod http://localhost:11434/api/tags -TimeoutSec 2; $ok = $true; break } catch { }
            if ($i -eq 0) { Start-Process -FilePath $bin -ArgumentList "serve" -WindowStyle Hidden }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Write-Error "server did not answer"; exit 1 }
          "api/tags: $($r | ConvertTo-Json -Compress)"

      - name: Pull a small model through /api/pull (the same call Robert makes)
        shell: pwsh
        run: |
          $body = @{ model = "qwen2.5:0.5b"; stream = $false } | ConvertTo-Json
          $r = Invoke-RestMethod -Method Post -Uri http://localhost:11434/api/pull -Body $body -ContentType "application/json" -TimeoutSec 600
          "pull status: $($r.status)"
          if ($r.status -ne "success") { exit 1 }
          (Invoke-RestMethod http://localhost:11434/api/tags).models | Select-Object name, size
